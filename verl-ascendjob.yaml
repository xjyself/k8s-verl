# 基于 verl-resche.yaml 等价改写
# 适配当前环境：
#   - verl 镜像
#   - 每节点 8 张 NPU
#   - Ray Head/Worker 通过 AscendJob 的 Master/Worker 区分
#   - 宿主机 hostPath 挂载模型/数据/脚本/checkpoint
apiVersion: mindxdl.gitee.com/v1
kind: AscendJob
metadata:
  name: verl-rl
  namespace: verl
  labels:
    framework: pytorch
    fault-scheduling: "force"
    fault-retry-times: "100"
    ring-controller.atlas: ascend-910b
    subHealthyStrategy: "ignore"
  annotations:
    # sp-block: "32"
    # 按实际芯片拓扑确认，8 卡/节点示例；16 卡/节点则用 chip2-node16-sp
    # huawei.com/schedule_policy: "chip2-node8-sp"
spec:
  schedulerName: volcano
  runPolicy:
    schedulingPolicy:
      minAvailable: 2
      queue: default
  successPolicy: AllWorkers
  replicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            ring-controller.atlas: ascend-910b
        spec:
          terminationGracePeriodSeconds: 60
          automountServiceAccountToken: false
          hostNetwork: true
          containers:
            - name: ascend
              image: quay.io/ascend/verl:v0.8.0-cann9.0.0-torch_npu2.9.0.post2-910b-ubuntu22.04-py3.11-vllm
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
              args:
                - bash /workspace/start.sh
              env:
                - name: RAY_ROLE
                  value: master
                - name: POD_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: HOME
                  value: /root
                - name: NNODES
                  value: "2"
                - name: NPUS_PER_NODE
                  value: "8"
              ports:
                - containerPort: 2222
                  name: ascendjob-port
                - containerPort: 6766
                  name: ray-port
                - containerPort: 8260
                  name: ray-dash-port
              resources:
                limits:
                  huawei.com/Ascend910: 8
                requests:
                  huawei.com/Ascend910: 8
              volumeMounts:
                - name: scripts
                  mountPath: /workspace
                - name: models
                  mountPath: /root/models
                - name: data-raw
                  mountPath: /workspace/hf_data
                - name: data-processed
                  mountPath: /root/data
                - name: checkpoints
                  mountPath: /root/checkpoints
                - name: ascend-driver
                  mountPath: /usr/local/Ascend/driver
                - name: dshm
                  mountPath: /dev/shm
                - name: localtime
                  mountPath: /etc/localtime
          volumes:
            - name: scripts
              hostPath:
                path: /home/scripts
                type: DirectoryOrCreate
            - name: models
              hostPath:
                path: /home/models
                type: DirectoryOrCreate
            - name: data-raw
              hostPath:
                path: /home/hf_data
                type: DirectoryOrCreate
            - name: data-processed
              hostPath:
                path: /home/data
                type: DirectoryOrCreate
            - name: checkpoints
              hostPath:
                path: /home/checkpoints
                type: DirectoryOrCreate
            - name: ascend-driver
              hostPath:
                path: /usr/local/Ascend/driver
            - name: dshm
              emptyDir:
                medium: Memory
            - name: localtime
              hostPath:
                path: /etc/localtime
    Worker:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            ring-controller.atlas: ascend-910b
        spec:
          terminationGracePeriodSeconds: 60
          automountServiceAccountToken: false
          hostNetwork: true
          containers:
            - name: ascend
              image: quay.io/ascend/verl:v0.8.0-cann9.0.0-torch_npu2.9.0.post2-910b-ubuntu22.04-py3.11-vllm
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
              args:
                - bash /workspace/start.sh
              env:
                - name: RAY_ROLE
                  value: worker
                - name: POD_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: HOME
                  value: /root
                - name: NPUS_PER_NODE
                  value: "8"
                # AscendJob 若注入了 MASTER_ADDR，会自动使用；
                # 没有注入时，改成 Master 所在节点 IP，例如 51.38.67.147:6766
                - name: RAY_HEAD_ADDR
                  value: 51.38.67.147:6766
              ports:
                - containerPort: 2222
                  name: ascendjob-port
              resources:
                limits:
                  huawei.com/Ascend910: 8
                requests:
                  huawei.com/Ascend910: 8
              volumeMounts:
                - name: scripts
                  mountPath: /workspace
                - name: models
                  mountPath: /root/models
                - name: data-raw
                  mountPath: /workspace/hf_data
                - name: data-processed
                  mountPath: /root/data
                - name: ascend-driver
                  mountPath: /usr/local/Ascend/driver
                - name: dshm
                  mountPath: /dev/shm
                - name: localtime
                  mountPath: /etc/localtime
          volumes:
            - name: scripts
              hostPath:
                path: /home/scripts
                type: DirectoryOrCreate
            - name: models
              hostPath:
                path: /home/models
                type: DirectoryOrCreate
            - name: data-raw
              hostPath:
                path: /home/hf_data
                type: DirectoryOrCreate
            - name: data-processed
              hostPath:
                path: /home/data
                type: DirectoryOrCreate
            - name: ascend-driver
              hostPath:
                path: /usr/local/Ascend/driver
            - name: dshm
              emptyDir:
                medium: Memory
            - name: localtime
              hostPath:
                path: /etc/localtime
